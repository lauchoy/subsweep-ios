name: SubSweep
options:
  bundleIdPrefix: com.lauchoy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  SubSweep:
    type: application
    platform: iOS
    sources:
      - SubSweep
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lauchoy.subsweep
        INFOPLIST_KEY_CFBundleDisplayName: SubSweep
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
  SubSweepTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SubSweepTests
    dependencies:
      - target: SubSweep
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.lauchoy.subsweep.tests
  SubSweepUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SubSweepUITests
    dependencies:
      - target: SubSweep
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.lauchoy.subsweep.uitests
        TEST_TARGET_NAME: SubSweep
schemes:
  SubSweep:
    build:
      targets:
        SubSweep: all
    run:
      config: Debug
      storeKitConfiguration: SubSweep.storekit
    test:
      config: Debug
      targets:
        - SubSweepTests
        - SubSweepUITests
